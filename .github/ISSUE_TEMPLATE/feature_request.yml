name: Feature request
description: Suggest an improvement to the converter or its workflow
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the workflow or limitation that prompted this request.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe what the app should do from a user's perspective.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note any workarounds or other approaches you have tried.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, screenshots, or relevant TIFF characteristics.