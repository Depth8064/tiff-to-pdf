version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/"
      - "/TiffToPdf.Core"
      - "/TiffToPdf.Tests"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
